name: "✨ Feature Request"
description: Suggest a new feature or improvement for Atoll
title: "[Feature]: "
labels:
  - enhancement

body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description: Is your feature request related to a problem?
      placeholder: I'm frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see.
      placeholder: It would be great if Atoll could...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any alternative solutions?

  - type: dropdown
    id: feature_area
    attributes:
      label: Feature Area
      options:
        - The Notch
        - Live Activities
        - Lock Screen Widgets
        - Calandar
        - Clipboard History
        - Other
      
    validations:
      required: true

  - type: textarea
    id: mockups
    attributes:
      label: Mockups / References
      description: Attach sketches, screenshots, or references.

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context, use cases, or information.