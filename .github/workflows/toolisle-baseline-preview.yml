name: Atoll baseline preview
on:
  push:
    branches: [review/atoll-logo-only]
    paths: [.github/workflows/toolisle-baseline-preview.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: atoll-baseline-preview
  cancel-in-progress: false
jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Audit original source and materialized LFS data
        run: |
          mkdir -p "$RUNNER_TEMP/review-output"
          python3 - <<'PY' | tee "$RUNNER_TEMP/review-output/baseline-audit.json"
          from pathlib import Path
          import hashlib, json, subprocess
          base = '83d15438efc5254635c5b425406d6603c80b8ece'
          def git(*args):
              return subprocess.check_output(['git', *args])
          def allowed(p):
              return (p in {'ReadMe.md', 'TOOLISLE.md', '.github/assets/atoll-logo.png', '.github/assets/toolisle-logo.svg', '.github/workflows/toolisle-baseline-preview.yml'} or (p.startswith('DynamicIsland/Assets.xcassets/AppIcon') and '.appiconset/' in p and p.endswith('.png')) or (p.startswith(('DynamicIsland/Assets.xcassets/logo.imageset/', 'DynamicIsland/Assets.xcassets/logo2.imageset/')) and p.endswith('.png')))
          changes = git('diff', '--name-only', base).decode().splitlines()
          assert not [p for p in changes if not allowed(p)], changes
          checked = 0
          media = []
          for p in git('ls-tree', '-r', '--name-only', base).decode().splitlines():
              if allowed(p):
                  continue
              f = Path(p)
              actual = str(f.readlink()).encode() if f.is_symlink() else f.read_bytes()
              expected = git('show', f'{base}:{p}')
              if expected.startswith(b'version https://git-lfs.github.com/spec/v1'):
                  fields = dict(line.split(' ', 1) for line in expected.decode().strip().splitlines())
                  assert len(actual) == int(fields['size']), p
                  assert hashlib.sha256(actual).hexdigest() == fields['oid'].split(':', 1)[1], p
                  media.append(p)
              else:
                  assert actual == expected, p
              checked += 1
          print(json.dumps({'baseline': base, 'source_commit': git('rev-parse','HEAD').decode().strip(), 'unchanged_file_count': checked, 'functional_source_changes': 0, 'verified_lfs_media': media, 'allowed_changes': changes}, ensure_ascii=False, indent=2))
          PY
          python3 -m unittest tests.test_privacy_configuration tests.test_timer_lifecycle 2>&1 | tee "$RUNNER_TEMP/review-output/upstream-tests.txt"
          { sw_vers; xcodebuild -version; uname -m; git rev-parse HEAD; } > "$RUNNER_TEMP/review-output/environment.txt"
      - name: Optional reuse of already verified identical application code
        id: previous
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: atoll-baseline-macos-preview
          run-id: 35692186004
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/previous-build
      - name: Validate optional reuse
        id: reuse
        run: |
          REUSED=false
          PREVIOUS="$RUNNER_TEMP/previous-build"
          if [ -f "$PREVIOUS/ToolIsle-Atoll-baseline-macOS-arm64.zip" ] && git diff --quiet c9887796606ad32668c7b550a28452567b724271 HEAD -- DynamicIsland DynamicIsland.xcodeproj; then
            grep -qx c9887796606ad32668c7b550a28452567b724271 "$PREVIOUS/environment.txt"
            export PREVIOUS
            python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          root = Path(os.environ['PREVIOUS'])
          for line in (root / 'SHA256SUMS').read_text().splitlines():
              digest, name = line.split(maxsplit=1)
              file = root / Path(name).name
              assert hashlib.sha256(file.read_bytes()).hexdigest() == digest, file
          PY
            ditto -x -k "$PREVIOUS/ToolIsle-Atoll-baseline-macOS-arm64.zip" "$RUNNER_TEMP/unpacked"
            mkdir -p "$RUNNER_TEMP/stage"
            ditto "$RUNNER_TEMP/unpacked/AtollPreview/Atoll.app" "$RUNNER_TEMP/stage/Atoll.app"
            cp "$PREVIOUS/build.log" "$RUNNER_TEMP/review-output/build.log"
            REUSED=true
          fi
          echo "reused=$REUSED" >> "$GITHUB_OUTPUT"
          echo "$REUSED" > "$RUNNER_TEMP/review-output/reused-identical-build.txt"
      - name: Fresh build when identical artifact is unavailable
        if: steps.reuse.outputs.reused != 'true'
        run: |
          sudo xcodebuild -runFirstLaunch
          sudo xcodebuild -downloadComponent MetalToolchain
          set -o pipefail
          xcodebuild build -project DynamicIsland.xcodeproj -scheme DynamicIsland \
            -configuration Debug -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/AtollDerivedData" -disableAutomaticPackageResolution \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM='' \
            CODE_SIGN_IDENTITY='-' CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=YES OTHER_CODE_SIGN_FLAGS='--timestamp=none' \
            2>&1 | tee "$RUNNER_TEMP/review-output/build.log"
          mkdir -p "$RUNNER_TEMP/stage"
          ditto "$RUNNER_TEMP/AtollDerivedData/Build/Products/Debug/Atoll.app" "$RUNNER_TEMP/stage/Atoll.app"
      - name: Restore full original animation resources and preserve entitlements
        run: |
          APP="$RUNNER_TEMP/stage/Atoll.app"
          export APP
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -d --entitlements :- "$APP" > "$RUNNER_TEMP/original-entitlements.plist"
          python3 - <<'PY' | tee "$RUNNER_TEMP/review-output/media-audit.json"
          import hashlib, json, os, shutil
          from pathlib import Path
          source = Path('DynamicIsland/BluetoothHUDAnimations')
          resources = Path(os.environ['APP']) / 'Contents/Resources'
          destination = resources / 'BluetoothHUDAnimations'
          destination.mkdir(exist_ok=True)
          result = []
          for file in sorted(source.glob('*.mov')):
              data = file.read_bytes()
              assert not data.startswith(b'version https://git-lfs'), file
              # Xcode copies flat resources; upstream Release additionally provides this folder.
              for target in [resources / file.name, destination / file.name]:
                  shutil.copy2(file, target)
                  assert target.read_bytes() == data
              result.append({'name': file.name, 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()})
          assert len(result) == 8
          pointers = []
          for p in resources.rglob('*'):
              if p.is_file() and not p.is_symlink():
                  with p.open('rb') as stream:
                      if stream.read(64).startswith(b'version https://git-lfs.github.com/spec/v1'):
                          pointers.append(str(p))
          assert not pointers, pointers
          print(json.dumps({'original_movie_count': len(result), 'unresolved_lfs_pointers_in_app': pointers, 'resources': result}, indent=2))
          PY
          codesign --force --sign '-' --timestamp=none --options runtime \
            --entitlements "$RUNNER_TEMP/original-entitlements.plist" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP" 2>&1 | tee "$RUNNER_TEMP/review-output/codesign-verify.txt"
          codesign -d --entitlements :- "$APP" > "$RUNNER_TEMP/review-output/entitlements.plist"
          python3 - <<'PY'
          import os, plistlib
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          assert plistlib.loads((root/'original-entitlements.plist').read_bytes()) == plistlib.loads((root/'review-output/entitlements.plist').read_bytes())
          PY
          /usr/libexec/PlistBuddy -c Print "$APP/Contents/Info.plist" > "$RUNNER_TEMP/review-output/app-info.txt"
          lipo -archs "$APP/Contents/MacOS/Atoll" > "$RUNNER_TEMP/review-output/architectures.txt"
          git diff --exit-code -- DynamicIsland DynamicIsland.xcodeproj
      - name: Normal launch and original local RPC smoke check
        run: |
          python3 - <<'PY'
          import json, os, socket, subprocess, time
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          out = root/'review-output'
          executable = root/'stage/Atoll.app/Contents/MacOS/Atoll'
          with (out/'launch.log').open('w') as log:
              p = subprocess.Popen([str(executable)], stdout=log, stderr=subprocess.STDOUT)
              time.sleep(20)
              code = p.poll()
              rpc = False
              if code is None:
                  try:
                      with socket.create_connection(('127.0.0.1', 9020), timeout=3):
                          rpc = True
                  except OSError:
                      pass
              report = {'command': str(executable), 'ui_testing_argument': False, 'seconds_observed': 20, 'alive_after_observation': code is None, 'exit_code': code, 'original_rpc_port_9020_open': rpc, 'developer_id_notarized': False, 'limitations': 'Process and port checks only. Physical notch, media playback, TCC, lock screen and extension client interaction need a real Mac acceptance test.'}
              (out/'launch-result.json').write_text(json.dumps(report, indent=2))
              print(json.dumps(report, indent=2))
              if code is None:
                  subprocess.run(['/usr/sbin/screencapture', '-x', str(out/'runner-screen.png')], check=False, timeout=10)
                  p.terminate()
                  try:
                      p.wait(timeout=10)
                  except subprocess.TimeoutExpired:
                      p.kill(); p.wait()
              assert code is None, 'Normal app startup failed; no original functionality was disabled to mask it.'
          PY
      - name: Package complete preview and corresponding source
        run: |
          cp TOOLISLE.md "$RUNNER_TEMP/stage/README-先读.md"
          cp "$RUNNER_TEMP/review-output/launch-result.json" "$RUNNER_TEMP/stage/"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/stage" "$RUNNER_TEMP/review-output/ToolIsle-Atoll-baseline-macOS-arm64.zip"
          hdiutil create -volname 'Atoll Baseline Review' -srcfolder "$RUNNER_TEMP/stage" -ov -format UDZO "$RUNNER_TEMP/review-output/ToolIsle-Atoll-baseline-macOS-arm64.dmg"
          git archive --format=zip --prefix=ToolIsle-Atoll-baseline/ -o "$RUNNER_TEMP/review-output/ToolIsle-Atoll-baseline-source.zip" HEAD
          git diff --binary 83d15438efc5254635c5b425406d6603c80b8ece HEAD > "$RUNNER_TEMP/review-output/logo-only.patch"
          git rev-parse HEAD > "$RUNNER_TEMP/review-output/source-commit.txt"
          shasum -a 256 "$RUNNER_TEMP/review-output/"*.zip "$RUNNER_TEMP/review-output/"*.dmg > "$RUNNER_TEMP/review-output/SHA256SUMS"
      - name: Collect failure diagnostics
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/review-output"
          find ~/Library/Logs/DiagnosticReports -maxdepth 1 -iname '*Atoll*' -exec cp {} "$RUNNER_TEMP/review-output/" \; || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atoll-baseline-complete-preview
          path: ${{ runner.temp }}/review-output/
          retention-days: 14
          if-no-files-found: warn
