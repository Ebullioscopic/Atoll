name: Update LLM Pricing Data

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-pricing:
    runs-on: ubuntu-latest
    if: github.repository == 'Ebullioscopic/Atoll'

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Fetch and update pricing
        run: |
          # Fetch all models from OpenRouter
          curl -s https://openrouter.ai/api/v1/models > all_models.json

          # Track every current Anthropic Claude and OpenAI GPT-5 / codex model
          # (excluding ":batch" variants) instead of a hand-maintained short list,
          # so newly released models are priced without a workflow change.
          jq --arg ts "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" '{
            models: [ .data[]
              | select(.id | test("^(anthropic/claude-|google/gemini-|openai/(gpt-5|gpt-4\\.1|o3|o4|codex))"))
              | select(.id | contains(":") | not)
              | select((.pricing | type) == "object")
              | select(.pricing.prompt != null and .pricing.completion != null)
              | {id: .id, name: .name, pricing: {prompt: .pricing.prompt, completion: .pricing.completion,
                  cache_read: (.pricing.input_cache_read // ""), cache_write: (.pricing.input_cache_write // "")}} ]
              | sort_by(.id),
            last_updated: $ts
          }' all_models.json > pricing_new.json

          mkdir -p DynamicIsland/managers/LLMUsage
          mv pricing_new.json DynamicIsland/managers/LLMUsage/pricing.json

          rm all_models.json

      - name: Commit and push changes
        run: |
          git config user.name "Atoll-XML-Updater[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add DynamicIsland/managers/LLMUsage/pricing.json

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore: update llm pricing data [skip ci]"

          # Push back to the branch this run checked out (the default branch for the
          # scheduled run). Pushing HEAD:main from a dev checkout is rejected as a
          # non-fast-forward whenever main is behind dev, which is why the daily run
          # had been failing.
          git push origin "HEAD:${GITHUB_REF_NAME}"