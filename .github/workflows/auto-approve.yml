name: Auto Approve Dependabot

# Auto-approves Dependabot PRs only. No external token required
# (uses the built-in github-actions bot). Scoped tightly via the
# pull_request.user.login guard (immutable PR author) rather than
# github.actor, which is mutable via "@dependabot recreate" and
# vulnerable to confused-deputy / pwn-request attacks.

on: pull_request_target

permissions:
  pull-requests: write

jobs:
  auto-approve:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        uses: dependabot/fetch-metadata@21025c705c08248db411dc16f3619e6b5f9ea21a # v2
      - uses: hmarr/auto-approve-action@8f929096a962e83ccdfa8afcf855f39f12d4dac7 # v4
        with:
          review-message: "Auto-approved Dependabot dependency update."
