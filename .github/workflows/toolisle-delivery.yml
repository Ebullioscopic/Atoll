name: ToolIsle Delivery
on:
  push:
    branches: [dev, feat/toolisle-foundation]
    paths: ['ToolIsle/**', 'scripts/*toolisle*', 'Package.*', '.github/workflows/toolisle-delivery.yml']
  pull_request:
    branches: [dev]
permissions:
  contents: read
concurrency:
  group: toolisle-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: swift --version && swift test
  macos-build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: xcodebuild -version && swift --version
      - name: Test and package locked dependencies
        run: |
          set -o pipefail
          swift test --force-resolved-versions 2>&1 | tee /tmp/toolisle-tests.log
          bash scripts/build-toolisle.sh release 2>&1 | tee /tmp/toolisle-build.log
      - name: Verify packaged app starts without credentials
        run: |
          APP="$PWD/dist/ToolIsle.app/Contents/MacOS/ToolIsle"
          "$APP" > /tmp/toolisle-launch.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          sleep 6
          if ! kill -0 "$PID" 2>/dev/null; then
            cat /tmp/toolisle-launch.log
            echo 'Packaged application exited unexpectedly.' >&2
            exit 1
          fi
          echo 'Packaged ToolIsle process remained alive for startup smoke test.'
      - name: Package corresponding source
        run: |
          git diff --check
          git archive --format=tar.gz -o /tmp/ToolIsle-source.tar.gz HEAD
          git rev-parse HEAD > /tmp/toolisle-revision.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ToolIsle-build-diagnostics
          path: |
            /tmp/toolisle-tests.log
            /tmp/toolisle-build.log
            /tmp/toolisle-launch.log
            /tmp/toolisle-revision.txt
            Package.resolved
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: ToolIsle-macOS
          path: dist/ToolIsle-*.zip
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: ToolIsle-source
          path: /tmp/ToolIsle-source.tar.gz
          if-no-files-found: error
          retention-days: 14
