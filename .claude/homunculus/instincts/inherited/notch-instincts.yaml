# Notch Workflow Feature Development With Settings Toggle

## Action

Follow the feature-development-with-settings-toggle workflow:
1. Implement core feature logic in relevant manager/component files.
2. Add new setting(s) to models/Constants.swift and/or SettingsView.
3. Wire up toggles in Settings UI (components/Settings/SettingsView.swift or similar).
4. Gate new logic behind Defaults keys and settings checks.
5. Update ContentView.swift and other root views to respect the new toggles.
6. Update or create subviews/components as needed.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: DynamicIsland/ContentView.swift, DynamicIsland/components/Settings/SettingsView.swift, DynamicIsland/models/Constants.swift

