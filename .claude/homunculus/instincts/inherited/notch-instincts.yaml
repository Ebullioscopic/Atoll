# Notch Workflow Feature Development New Tab Or View

## Action

Follow the feature-development-new-tab-or-view workflow:
1. Create new SwiftUI view file for the tab (components/Notch/ or similar).
2. Add new case to enums/generic.swift or similar enum for tab selection.
3. Register the new tab in TabSelectionView.swift.
4. Wire up tab logic in ContentView.swift (switch/case or navigation).
5. Add any required settings toggle or enable/disable logic.
6. Update models/Constants.swift if needed for tab configuration.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: DynamicIsland/ContentView.swift, DynamicIsland/components/Notch/*.swift, DynamicIsland/components/Tabs/TabSelectionView.swift

