# Notch Workflow Extension Connection Lifecycle Cleanup

## Action

Follow the extension-connection-lifecycle-cleanup workflow:
1. Implement or update cleanup logic in ExtensionRPCServer.swift to handle disconnects.
2. Add or adjust grace period timers for delayed cleanup.
3. Ensure live activities are dismissed only when appropriate (e.g., after grace period, or when no other connections exist).
4. Cancel or reset grace tasks as needed on reconnect or server stop.
5. Update related UI (e.g., NotchAgentBusView) to reflect connection state.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: DynamicIsland/services/Extensions/ExtensionRPCServer.swift, DynamicIsland/components/Notch/NotchAgentBusView.swift

