# Notch Workflow Bugfix Following Feature Refactor

## Action

Follow the bugfix-following-feature-refactor workflow:
1. Identify the root cause of the bug (e.g., tuple label mismatch, binding error).
2. Update affected files to resolve the issue (e.g., fix tuple labels, change binding patterns).
3. Test to ensure the fix resolves the regression.
4. Commit with a 'fix:' prefix and reference to the refactor or feature.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: DynamicIsland/ContentView.swift, DynamicIsland/managers/*.swift, DynamicIsland/components/**/*.swift

